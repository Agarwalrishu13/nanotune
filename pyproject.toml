[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanotune"
version = "0.2.0"
description = "Your music, one page, no account — point it at a folder and press play, on your own computer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Agarwal" }]
keywords = ["music", "player", "local-first", "offline", "beginners", "audio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = []

[project.scripts]
nanotune = "nanotune.__main__:main"

[project.urls]
Homepage = "https://github.com/Agarwalrishu13/nanotune"

[tool.setuptools]
packages = ["nanotune"]
include-package-data = true

[tool.setuptools.package-data]
nanotune = ["web/*"]
